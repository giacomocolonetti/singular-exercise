[project]
name = "singular-exercise"
version = "0.1.0"
description = "Golden table, MMP switch/renewal opportunities and CRM sync design for Singular's go-to-market team"
readme = "README.md"
authors = [
    { name = "Giacomo Colonetti", email = "giacomo@avem.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
